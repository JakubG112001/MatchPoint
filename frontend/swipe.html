<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Swipe - MatchPoint</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <img src="https://via.placeholder.com/300" alt="Profile">
    <h2 id="name">Alex, 25</h2>
    <p id="bio">Loves hiking and coffee ☕</p>

    <div class="actions">
      <button class="dislike" onclick="swipe('left')">❌</button>
      <button class="like" onclick="swipe('right')">❤️</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
