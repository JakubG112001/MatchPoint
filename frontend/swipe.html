<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Swipe - MatchPoint</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="logout-btn" onclick="logout()" style="position: fixed; top: 10px; right: 10px; padding: 5px 10px; background: #333; color: white; border: none; border-radius: 5px; cursor: pointer; z-index: 1000;">Logout</button>

  <div class="card">
<img id="profile-img" src="https://via.placeholder.com/300" alt="Profile">
<h2 id="profile-name"></h2>
<p id="profile-bio"></p>

    <div class="actions">
      <button class="dislike" onclick="swipe('left')">❌</button>
      <button class="like" onclick="swipe('right')">❤️</button>
    </div>
    <br>
    <a href="matches.html"><button>View Matches</button></a>
  </div>

  <script src="https://unpkg.com/aws-amplify@5/dist/aws-amplify.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
